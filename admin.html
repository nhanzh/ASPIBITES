<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPI Bites - Portal Admin</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo" style="text-align: center; padding: 15px 0;">
            <h1>ASPI<span>Bites</span></h1>
            <p style="color: #2563eb; font-size: 0.85em; font-weight: bold;">🔑 Dashboard Kawalan Pentadbir Sistem</p>
        </div>
    </header>

    <main class="container">

        <!-- RINGKASAN LEJER RAHASIA (DISOROKKAN SEMASA PRESENTATION) -->
        <section class="card-box" style="display: none; background-color: #eff6ff; border: 1px solid #bfdbfe;" id="admin-commission-section">
            <h3>💰 Lejer Komisyen Admin (RM 1.00 / Order)</h3>
            <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                <div>
                    <p style="margin:0; font-size: 0.85em; color: #1e40af;">Jumlah Pesanan Sah:</p>
                    <h2 id="total-orders-count" style="margin: 0; color: #1e3a8a;">0</h2>
                </div>
                <div style="text-align: right;">
                    <p style="margin:0; font-size: 0.85em; color: #1e40af;">Terkumpul Komisyen Admin:</p>
                    <h2 id="total-admin-commission" style="margin: 0; color: #15803d;">RM 0.00</h2>
                </div>
            </div>
        </section>

        <!-- KAWALAN SEMUA PESANAN (REAL-TIME) -->
        <section class="card-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                <h3 style="margin: 0;">📊 Senarai Pesanan Keseluruhan System</h3>
                <button onclick="padamSemuaPesananSystem()" style="background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 5px; font-size: 0.75em; font-weight: bold; cursor: pointer;">🗑️ Padam Semua Pesanan</button>
            </div>
            <div id="admin-orders-list">
                <p style="color: #888;">Memuatkan data pesanan...</p>
            </div>
        </section>

        <!-- SENARAI VENDOR BERDAFTAR -->
        <section class="card-box">
            <h3>🏪 Senarai Vendor Berdaftar</h3>
            <div id="admin-vendors-list">
                <p style="color: #888;">Memuatkan vendor...</p>
            </div>
        </section>

    </main>

    <script src="admin.js"></script>
</body>
</html>
